<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">EV choice experiment · Three ways to model the same choices</title><desc id="desc">Reported study architecture. Each model answers a different question about preference differences. Arrows show the analysis sequence, not causal effects.</desc><rect width="1000" height="700" rx="18" fill="#faf9f6"/><g font-family="Calibri,Arial,sans-serif" fill="#24272c"><text x="35" y="41" font-size="15" fill="#365c80">Reported study architecture</text><text x="35" y="82" font-size="29" font-weight="700">Three ways to model the same choices</text><g transform="translate(0 105)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#858981" stroke-width="1.5"/></marker></defs><path d="M 212 250 C 261.5 250, 261.5 100, 311 100" class="model-edge" data-from="choice" data-to="mnl" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Choice tasks → Multinomial logit</title></path><path d="M 212 250 C 261.5 250, 261.5 250, 311 250" class="model-edge" data-from="choice" data-to="mixed" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Choice tasks → Mixed logit</title></path><path d="M 212 250 C 261.5 250, 261.5 400, 311 400" class="model-edge" data-from="choice" data-to="class" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Choice tasks → Latent class</title></path><path d="M 502 100 C 601.5 100, 601.5 250, 701 250" class="model-edge" data-from="mnl" data-to="wtp" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Multinomial logit → Willingness to pay</title></path><path d="M 502 250 C 601.5 250, 601.5 250, 701 250" class="model-edge" data-from="mixed" data-to="wtp" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Mixed logit → Willingness to pay</title></path><path d="M 502 400 C 601.5 400, 601.5 250, 701 250" class="model-edge" data-from="class" data-to="wtp" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Latent class → Willingness to pay</title></path><g><title>212 validated young consumers compared vehicle profiles. Repeated tasks belong to the same respondent; they are not independent new consumers.</title><rect x="28" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="120" y="224" text-anchor="middle" font-size="12" fill="#666b66">Stated preference</text><text x="120" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Choice tasks</text></g><g><title>Estimate a shared utility specification as a baseline. Price and vehicle features enter the choice model; the archive does not provide a complete comparison table.</title><rect x="318" y="51" width="184" height="98" rx="12" fill="#eeece5"/><text x="410" y="74" text-anchor="middle" font-size="12" fill="#666b66">Common preference</text><text x="410" y="101" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Multinomial logit</text></g><g><title>Allow preferences to vary across people rather than imposing one coefficient vector. Distribution and simulation settings require the full estimation specification.</title><rect x="318" y="201" width="184" height="98" rx="12" fill="#365c80"/><text x="410" y="224" text-anchor="middle" font-size="12" fill="#ffffffcc">Continuous variation</text><text x="410" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Mixed logit</text></g><g><title>Represent preference differences with two reported groups: 65% utility-focused and 35% design-sensitive. These are model-based groups rather than observed market shares.</title><rect x="318" y="351" width="184" height="98" rx="12" fill="#eeece5"/><text x="410" y="374" text-anchor="middle" font-size="12" fill="#666b66">Discrete groups</text><text x="410" y="401" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Latent class</text></g><g><title>Express feature trade-offs relative to price, with intervals. The displayed values come from the reported latent class model and summarize stated preferences in the task design.</title><rect x="708" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="800" y="224" text-anchor="middle" font-size="12" fill="#666b66">Model output</text><text x="800" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Willingness to pay</text></g></g><text x="35" y="622" font-size="15" fill="#666b66">Arrows show the analysis sequence, not causal effects.</text><text x="35" y="651" font-size="13" fill="#666b66">Allow preferences to vary across people rather than imposing one coefficient vector. Distribution and simulation</text><text x="35" y="669" font-size="13" fill="#666b66">settings require the full estimation specification.</text></g></svg>