<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Hotel customer value · From themes to service hypotheses</title><desc id="desc">Conceptual framework · not estimated. This map is an interpretation framework linked to the segmentation study. Arrows represent interpretation steps, not estimated structural paths.</desc><rect width="1000" height="700" rx="18" fill="#faf9f6"/><g font-family="Calibri,Arial,sans-serif" fill="#24272c"><text x="35" y="41" font-size="15" fill="#957044">Conceptual framework · not estimated</text><text x="35" y="82" font-size="29" font-weight="700">From themes to service hypotheses</text><g transform="translate(0 105)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#858981" stroke-width="1.5"/></marker></defs><path d="M 242 250 C 311.5 250, 311.5 100, 381 100" class="model-edge" data-from="themes" data-to="comfort" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Review themes → Comfort + care</title></path><path d="M 242 250 C 311.5 250, 311.5 250, 381 250" class="model-edge" data-from="themes" data-to="local" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Review themes → Local experience</title></path><path d="M 242 250 C 311.5 250, 311.5 400, 381 400" class="model-edge" data-from="themes" data-to="overall" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Review themes → Overall value</title></path><path d="M 572 100 C 646.5 100, 646.5 250, 721 250" class="model-edge" data-from="comfort" data-to="service" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Comfort + care → Service hypotheses</title></path><path d="M 572 250 C 646.5 250, 646.5 250, 721 250" class="model-edge" data-from="local" data-to="service" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Local experience → Service hypotheses</title></path><path d="M 572 400 C 646.5 400, 646.5 250, 721 250" class="model-edge" data-from="overall" data-to="service" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Overall value → Service hypotheses</title></path><g><title>Start with recurring themes from the Da Nang review analysis. This framework does not add an independent dataset.</title><rect x="58" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="150" y="224" text-anchor="middle" font-size="12" fill="#666b66">Source patterns</text><text x="150" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Review themes</text></g><g><title>Connect room comfort and service care to possible guest priorities. These dimensions provide an interpretation vocabulary, not estimated importance weights.</title><rect x="388" y="51" width="184" height="98" rx="12" fill="#957044"/><text x="480" y="74" text-anchor="middle" font-size="12" fill="#ffffffcc">Value dimensions</text><text x="480" y="101" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Comfort + care</text></g><g><title>Connect food, location and ambience with what guests seek during a stay. Avoid assigning the same priority to every guest group.</title><rect x="388" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="480" y="224" text-anchor="middle" font-size="12" fill="#666b66">Value dimensions</text><text x="480" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Local experience</text></g><g><title>Relate price and the overall stay to value judgments. A theme alone does not identify willingness to pay.</title><rect x="388" y="351" width="184" height="98" rx="12" fill="#eeece5"/><text x="480" y="374" text-anchor="middle" font-size="12" fill="#666b66">Value dimension</text><text x="480" y="401" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Overall value</text></g><g><title>Translate themes into service or messaging options to test. A plausible guest story remains a hypothesis until measured.</title><rect x="728" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="820" y="224" text-anchor="middle" font-size="12" fill="#666b66">Application</text><text x="820" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Service hypotheses</text></g></g><text x="35" y="622" font-size="15" fill="#666b66">Arrows represent interpretation steps, not estimated structural paths.</text><text x="35" y="651" font-size="13" fill="#666b66">Connect room comfort and service care to possible guest priorities. These dimensions provide an interpretation</text><text x="35" y="669" font-size="13" fill="#666b66">vocabulary, not estimated importance weights.</text></g></svg>