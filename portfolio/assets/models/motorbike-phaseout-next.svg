<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Motorbike phase-out policy · Test the transition before scaling it</title><desc id="desc">Proposed extension · not performed. Separate a richer preference model from an evaluation of actual policy support. Proposed workflow. No new data or model results are claimed.</desc><rect width="1000" height="700" rx="18" fill="#faf9f6"/><g font-family="Calibri,Arial,sans-serif" fill="#24272c"><text x="35" y="41" font-size="15" fill="#47716d">Proposed extension · not performed</text><text x="35" y="82" font-size="29" font-weight="700">Test the transition before scaling it</text><g transform="translate(0 105)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#858981" stroke-width="1.5"/></marker></defs><path d="M 212 250 C 246.5 250, 246.5 250, 281 250" class="model-edge" data-from="replicate" data-to="heterogeneity" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Recover choice data → Mixed / latent class</title></path><path d="M 472 250 C 506.5 250, 506.5 250, 541 250" class="model-edge" data-from="heterogeneity" data-to="outside" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Mixed / latent class → District holdout</title></path><path d="M 732 250 C 756.5 250, 756.5 250, 781 250" class="model-edge" data-from="outside" data-to="pilot" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>District holdout → Support-package pilot</title></path><g><title>Recover the task design, coding and respondent identifiers. Reproduce the interaction and willingness-to-pay estimates before adding model complexity.</title><rect x="28" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="120" y="224" text-anchor="middle" font-size="12" fill="#666b66">Reproducibility</text><text x="120" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Recover choice data</text></g><g><title>Compare continuous and discrete preference variation with the existing specification. Do not assign additional classes without stable fit and interpretable profiles.</title><rect x="288" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="380" y="224" text-anchor="middle" font-size="12" fill="#666b66">Candidate extension</text><text x="380" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Mixed / latent</text><text x="380" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">class</text></g><g><title>Test packages in independently sampled districts and income groups. Keep uncertainty visible for groups with limited coverage.</title><rect x="548" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="640" y="224" text-anchor="middle" font-size="12" fill="#666b66">Transferability</text><text x="640" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">District holdout</text></g><g><title>Evaluate a feasible support measure using a prespecified comparison. Observe uptake, travel costs and mode use; do not read simulated acceptance as actual compliance.</title><rect x="788" y="201" width="184" height="98" rx="12" fill="#47716d"/><text x="880" y="224" text-anchor="middle" font-size="12" fill="#ffffffcc">Observed outcome</text><text x="880" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Support-package</text><text x="880" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">pilot</text></g></g><text x="35" y="622" font-size="15" fill="#666b66">Proposed workflow. No new data or model results are claimed.</text><text x="35" y="651" font-size="13" fill="#666b66">Evaluate a feasible support measure using a prespecified comparison. Observe uptake, travel costs and mode use; do not</text><text x="35" y="669" font-size="13" fill="#666b66">read simulated acceptance as actual compliance.</text></g></svg>