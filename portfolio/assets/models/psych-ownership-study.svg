<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Psychological ownership at university · Individual and shared ownership</title><desc id="desc">Conceptual framework · not estimated. A conceptual framework for relationships to test in an organizational setting. Arrows represent proposed relationships. No structural coefficients have been estimated.</desc><rect width="1000" height="700" rx="18" fill="#faf9f6"/><g font-family="Calibri,Arial,sans-serif" fill="#24272c"><text x="35" y="41" font-size="15" fill="#4d6972">Conceptual framework · not estimated</text><text x="35" y="82" font-size="29" font-weight="700">Individual and shared ownership</text><g transform="translate(0 105)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#858981" stroke-width="1.5"/></marker></defs><path d="M 222 250 C 276.5 250, 276.5 125, 331 125" class="model-edge" data-from="control" data-to="individual" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Control + identification → Individual ownership</title></path><path d="M 222 250 C 276.5 250, 276.5 375, 331 375" class="model-edge" data-from="control" data-to="collective" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Control + identification → Collective ownership</title></path><path d="M 522 125 C 566.5 125, 566.5 250, 611 250" class="model-edge" data-from="individual" data-to="commitment" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Individual ownership → Commitment</title></path><path d="M 522 375 C 566.5 375, 566.5 250, 611 250" class="model-edge" data-from="collective" data-to="commitment" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Collective ownership → Commitment</title></path><path d="M 710 299 C 710 334, 880 334, 880 369" class="model-edge" data-from="commitment" data-to="cooperation" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Commitment → Cooperation</title></path><g><title>The framework links control over work, identification and responsibility with a felt ownership connection. The current source does not provide an estimated measurement model.</title><rect x="38" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="130" y="224" text-anchor="middle" font-size="12" fill="#666b66">Proposed antecedents</text><text x="130" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Control +</text><text x="130" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">identification</text></g><g><title>A felt sense that a work target is mine. It is distinct from legal ownership and from a verified claim of higher performance.</title><rect x="338" y="76" width="184" height="98" rx="12" fill="#eeece5"/><text x="430" y="99" text-anchor="middle" font-size="12" fill="#666b66">Concept</text><text x="430" y="126" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Individual</text><text x="430" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">ownership</text></g><g><title>A shared sense that the target is ours. Team-level meaning requires a justified measure and aggregation; it cannot be assumed from one person's answer.</title><rect x="338" y="326" width="184" height="98" rx="12" fill="#4d6972"/><text x="430" y="349" text-anchor="middle" font-size="12" fill="#ffffffcc">Concept</text><text x="430" y="376" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Collective</text><text x="430" y="400" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">ownership</text></g><g><title>The framework proposes commitment as a link to cooperative behavior. No coefficients, sample or confirmed mediation test are supplied.</title><rect x="618" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="710" y="224" text-anchor="middle" font-size="12" fill="#666b66">Proposed mediator</text><text x="710" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Commitment</text></g><g><title>Define observable cooperative behavior before collecting data. This conceptual endpoint does not establish employee retention or teaching improvement.</title><rect x="788" y="376" width="184" height="98" rx="12" fill="#eeece5"/><text x="880" y="399" text-anchor="middle" font-size="12" fill="#666b66">Proposed outcome</text><text x="880" y="426" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Cooperation</text></g></g><text x="35" y="622" font-size="15" fill="#666b66">Arrows represent proposed relationships. No structural coefficients have been estimated.</text><text x="35" y="651" font-size="13" fill="#666b66">A shared sense that the target is ours. Team-level meaning requires a justified measure and aggregation; it cannot be</text><text x="35" y="669" font-size="13" fill="#666b66">assumed from one person's answer.</text></g></svg>