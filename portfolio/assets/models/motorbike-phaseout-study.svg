<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Motorbike phase-out policy · Policy packages, preferences and acceptance</title><desc id="desc">Reported study architecture. The model accounts for both the package and differences between respondents. Arrows show the analysis sequence, not causal effects.</desc><rect width="1000" height="700" rx="18" fill="#faf9f6"/><g font-family="Calibri,Arial,sans-serif" fill="#24272c"><text x="35" y="41" font-size="15" fill="#47716d">Reported study architecture</text><text x="35" y="82" font-size="29" font-weight="700">Policy packages, preferences and acceptance</text><g transform="translate(0 105)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#858981" stroke-width="1.5"/></marker></defs><path d="M 242 125 C 316.5 125, 316.5 250, 391 250" class="model-edge" data-from="policy" data-to="choice" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Restrictions + support → Policy-choice model</title></path><path d="M 242 375 C 316.5 375, 316.5 250, 391 250" class="model-edge" data-from="people" data-to="choice" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Dependence + context → Policy-choice model</title></path><path d="M 582 250 C 651.5 250, 651.5 250, 721 250" class="model-edge" data-from="choice" data-to="wtp" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Policy-choice model → Monthly WTP</title></path><g><title>Packages combine restrictions with grants, public transport, fares and reinvestment measures. Values refer to the supplied policy-choice specification.</title><rect x="58" y="76" width="184" height="98" rx="12" fill="#eeece5"/><text x="150" y="99" text-anchor="middle" font-size="12" fill="#666b66">Choice attributes</text><text x="150" y="126" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Restrictions +</text><text x="150" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">support</text></g><g><title>The reported interaction analysis includes motorcycle dependence, income, environmental concern and trust. These are preference differences, not randomized personal traits.</title><rect x="58" y="326" width="184" height="98" rx="12" fill="#47716d"/><text x="150" y="349" text-anchor="middle" font-size="12" fill="#ffffffcc">Interactions</text><text x="150" y="376" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Dependence +</text><text x="150" y="400" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">context</text></g><g><title>Estimate how package features change stated choices. The project materials report n = 320 and ρ² = 0.28; a full estimation file is not available here.</title><rect x="398" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="490" y="224" text-anchor="middle" font-size="12" fill="#666b66">Utility estimation</text><text x="490" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Policy-choice model</text></g><g><title>Convert model coefficients relative to cost into VND per month. Positive support values and negative restriction values describe stated trade-offs.</title><rect x="728" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="820" y="224" text-anchor="middle" font-size="12" fill="#666b66">Trade-off interpretation</text><text x="820" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Monthly WTP</text></g></g><text x="35" y="622" font-size="15" fill="#666b66">Arrows show the analysis sequence, not causal effects.</text><text x="35" y="651" font-size="13" fill="#666b66">The reported interaction analysis includes motorcycle dependence, income, environmental concern and trust. These are</text><text x="35" y="669" font-size="13" fill="#666b66">preference differences, not randomized personal traits.</text></g></svg>