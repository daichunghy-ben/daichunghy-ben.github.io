<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Buffet menu choices · Move from intended choice to restaurant behavior</title><desc id="desc">Proposed extension · not performed. Test the menu intervention where diners order and eat. Proposed workflow. No new data or model results are claimed.</desc><rect width="1000" height="700" rx="18" fill="#faf9f6"/><g font-family="Calibri,Arial,sans-serif" fill="#24272c"><text x="35" y="41" font-size="15" fill="#996447">Proposed extension · not performed</text><text x="35" y="82" font-size="29" font-weight="700">Move from intended choice to restaurant behavior</text><g transform="translate(0 105)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#858981" stroke-width="1.5"/></marker></defs><path d="M 212 250 C 246.5 250, 246.5 250, 281 250" class="model-edge" data-from="assign" data-to="measure" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Menu randomization → Orders + plate waste</title></path><path d="M 472 250 C 506.5 250, 506.5 250, 541 250" class="model-edge" data-from="measure" data-to="analysis" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Orders + plate waste → Multilevel contrasts</title></path><path d="M 732 250 C 756.5 250, 756.5 250, 781 250" class="model-edge" data-from="analysis" data-to="rollout" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Multilevel contrasts → Balance health + spend</title></path><g><title>Randomize menu versions at a practical unit such as a session or table. Prevent exposure to both versions and document implementation failures.</title><rect x="28" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="120" y="224" text-anchor="middle" font-size="12" fill="#666b66">Field experiment</text><text x="120" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Menu randomization</text></g><g><title>Record ordered tier, food served and food left using a consistent protocol. Define how estimated calories and waste are measured.</title><rect x="288" y="201" width="184" height="98" rx="12" fill="#996447"/><text x="380" y="224" text-anchor="middle" font-size="12" fill="#ffffffcc">Observed outcomes</text><text x="380" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Orders + plate</text><text x="380" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">waste</text></g><g><title>Account for diners nested in the randomization unit. Prespecify the primary nutrition or waste outcome and a commercial guardrail such as spend.</title><rect x="548" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="640" y="224" text-anchor="middle" font-size="12" fill="#666b66">Candidate analysis</text><text x="640" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Multilevel</text><text x="640" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">contrasts</text></g><g><title>Use effect intervals and the commercial guardrail to decide whether to retain the menu order. A subgroup model is exploratory unless powered and prespecified.</title><rect x="788" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="880" y="224" text-anchor="middle" font-size="12" fill="#666b66">Next decision</text><text x="880" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Balance health +</text><text x="880" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">spend</text></g></g><text x="35" y="622" font-size="15" fill="#666b66">Proposed workflow. No new data or model results are claimed.</text><text x="35" y="651" font-size="13" fill="#666b66">Record ordered tier, food served and food left using a consistent protocol. Define how estimated calories and waste are</text><text x="35" y="669" font-size="13" fill="#666b66">measured.</text></g></svg>