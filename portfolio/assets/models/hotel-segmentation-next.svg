<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Hotel customer segmentation · Test whether the segments travel</title><desc id="desc">Proposed extension · not performed. Develop a reproducible NLP and clustering benchmark before applying profiles to new hotels. Proposed workflow. No new data or model results are claimed.</desc><rect width="1000" height="700" rx="18" fill="#faf9f6"/><g font-family="Calibri,Arial,sans-serif" fill="#24272c"><text x="35" y="41" font-size="15" fill="#315f70">Proposed extension · not performed</text><text x="35" y="82" font-size="29" font-weight="700">Test whether the segments travel</text><g transform="translate(0 105)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#858981" stroke-width="1.5"/></marker></defs><path d="M 212 250 C 246.5 250, 246.5 135, 281 135" class="model-edge" data-from="audit" data-to="text" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Annotated reviews → Embedding + ABSA</title></path><path d="M 472 135 C 506.5 135, 506.5 135, 541 135" class="model-edge" data-from="text" data-to="models" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Embedding + ABSA → K-means / GMM</title></path><path d="M 640 184 C 640 249, 640 249, 640 314" class="model-edge" data-from="models" data-to="holdout" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>K-means / GMM → Unseen hotels + dates</title></path><path d="M 732 370 C 756.5 370, 756.5 250, 781 250" class="model-edge" data-from="holdout" data-to="service" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Unseen hotels + dates → Service trial</title></path><g><title>Create a stratified human-labelled subset covering languages, hotel classes and positive and negative reviews. Keep annotator agreement and uncertain labels visible.</title><rect x="28" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="120" y="224" text-anchor="middle" font-size="12" fill="#666b66">Data audit</text><text x="120" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Annotated reviews</text></g><g><title>Compare the existing attribute features with multilingual sentence embeddings and a sentiment model. Fine-tuning is conditional on enough labelled examples; no checkpoint has been trained here.</title><rect x="288" y="86" width="184" height="98" rx="12" fill="#eeece5"/><text x="380" y="109" text-anchor="middle" font-size="12" fill="#666b66">Candidate features</text><text x="380" y="136" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Embedding + ABSA</text></g><g><title>Compare cluster counts, feature scaling and covariance choices. Consider HDBSCAN only if uneven density or outliers make the existing partition unsuitable.</title><rect x="548" y="86" width="184" height="98" rx="12" fill="#eeece5"/><text x="640" y="109" text-anchor="middle" font-size="12" fill="#666b66">Benchmark</text><text x="640" y="136" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">K-means / GMM</text></g><g><title>Reserve hotels and a later time window. Examine cluster stability, semantic coherence and assignment uncertainty, not just a visually neat two-dimensional plot.</title><rect x="548" y="321" width="184" height="98" rx="12" fill="#315f70"/><text x="640" y="344" text-anchor="middle" font-size="12" fill="#ffffffcc">Validation</text><text x="640" y="371" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Unseen hotels +</text><text x="640" y="395" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">dates</text></g><g><title>Use validated profiles to choose one service intervention. Test guest outcomes with a separate design; cluster membership alone does not show that an intervention works.</title><rect x="788" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="880" y="224" text-anchor="middle" font-size="12" fill="#666b66">Next decision</text><text x="880" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Service trial</text></g></g><text x="35" y="622" font-size="15" fill="#666b66">Proposed workflow. No new data or model results are claimed.</text><text x="35" y="651" font-size="13" fill="#666b66">Reserve hotels and a later time window. Examine cluster stability, semantic coherence and assignment uncertainty, not</text><text x="35" y="669" font-size="13" fill="#666b66">just a visually neat two-dimensional plot.</text></g></svg>