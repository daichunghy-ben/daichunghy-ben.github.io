<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Psychological ownership at university · Build the measures before testing the pathway</title><desc id="desc">Proposed extension · not performed. Develop a setting-specific ownership study with individual and team levels kept distinct. Proposed workflow. No new data or model results are claimed.</desc><rect width="1000" height="700" rx="18" fill="#faf9f6"/><g font-family="Calibri,Arial,sans-serif" fill="#24272c"><text x="35" y="41" font-size="15" fill="#4d6972">Proposed extension · not performed</text><text x="35" y="82" font-size="29" font-weight="700">Build the measures before testing the pathway</text><g transform="translate(0 105)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#858981" stroke-width="1.5"/></marker></defs><path d="M 212 250 C 246.5 250, 246.5 250, 281 250" class="model-edge" data-from="define" data-to="pilot" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Interviews + definitions → Items + pilot</title></path><path d="M 472 250 C 506.5 250, 506.5 125, 541 125" class="model-edge" data-from="pilot" data-to="validate" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Items + pilot → Independent CFA</title></path><path d="M 472 250 C 506.5 250, 506.5 375, 541 375" class="model-edge" data-from="pilot" data-to="teams" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Items + pilot → Team structure</title></path><path d="M 732 125 C 756.5 125, 756.5 250, 781 250" class="model-edge" data-from="validate" data-to="sem" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Independent CFA → Longitudinal pathway</title></path><path d="M 732 375 C 756.5 375, 756.5 250, 781 250" class="model-edge" data-from="teams" data-to="sem" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Team structure → Longitudinal pathway</title></path><g><title>Identify the ownership target and who shares it. Interview contrasting roles before selecting or adapting items.</title><rect x="28" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="120" y="224" text-anchor="middle" font-size="12" fill="#666b66">Construct work</text><text x="120" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Interviews +</text><text x="120" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">definitions</text></g><g><title>Check comprehension and content coverage for individual ownership, collective ownership, commitment and cooperation.</title><rect x="288" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="380" y="224" text-anchor="middle" font-size="12" fill="#666b66">Measurement</text><text x="380" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Items + pilot</text></g><g><title>Test distinctness and uncertainty in an independent sample. A good fit index alone does not establish valid measurement.</title><rect x="548" y="76" width="184" height="98" rx="12" fill="#eeece5"/><text x="640" y="99" text-anchor="middle" font-size="12" fill="#666b66">Candidate validation</text><text x="640" y="126" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Independent CFA</text></g><g><title>Examine whether a shared ownership construct supports aggregation. Use a multilevel design only with enough independent teams.</title><rect x="548" y="326" width="184" height="98" rx="12" fill="#4d6972"/><text x="640" y="349" text-anchor="middle" font-size="12" fill="#ffffffcc">Level check</text><text x="640" y="376" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Team structure</text></g><g><title>Measure ownership before commitment and cooperation. Evaluate alternative explanations and report associations unless a stronger identification strategy is available.</title><rect x="788" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="880" y="224" text-anchor="middle" font-size="12" fill="#666b66">Proposed test</text><text x="880" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Longitudinal</text><text x="880" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">pathway</text></g></g><text x="35" y="622" font-size="15" fill="#666b66">Proposed workflow. No new data or model results are claimed.</text><text x="35" y="651" font-size="13" fill="#666b66">Examine whether a shared ownership construct supports aggregation. Use a multilevel design only with enough independent</text><text x="35" y="669" font-size="13" fill="#666b66">teams.</text></g></svg>