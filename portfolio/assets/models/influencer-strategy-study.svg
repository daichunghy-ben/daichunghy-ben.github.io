<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Influencer engagement and retention · Measurement first, structural paths second</title><desc id="desc">Reported study architecture. EFA uses 200 responses; CFA and SEM use the remaining 365. Arrows show hypothesized structural relationships; cross-sectional SEM does not establish causal direction.</desc><rect width="1000" height="700" rx="18" fill="#faf9f6"/><g font-family="Calibri,Arial,sans-serif" fill="#24272c"><text x="35" y="41" font-size="15" fill="#6a5879">Reported study architecture</text><text x="35" y="82" font-size="29" font-weight="700">Measurement first, structural paths second</text><g transform="translate(0 105)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#858981" stroke-width="1.5"/></marker></defs><path d="M 242 100 C 316.5 100, 316.5 250, 391 250" class="model-edge" data-from="cx" data-to="engagement" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Content experience → Consumer engagement: Path</title></path><path d="M 242 250 C 316.5 250, 316.5 250, 391 250" class="model-edge" data-from="cex" data-to="engagement" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Expectation alignment → Consumer engagement: Path</title></path><path d="M 242 400 C 316.5 400, 316.5 250, 391 250" class="model-edge" data-from="be" data-to="engagement" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Brand equity transfer → Consumer engagement: Path</title></path><path d="M 582 250 C 651.5 250, 651.5 250, 721 250" class="model-edge" data-from="engagement" data-to="retention" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Consumer engagement → Customer retention: Mediation model</title></path><g><title>Content experience is one of the three modeled antecedents of consumer engagement. Its scale captures the survey construct defined in the manuscript.</title><rect x="58" y="51" width="184" height="98" rx="12" fill="#eeece5"/><text x="150" y="74" text-anchor="middle" font-size="12" fill="#666b66">CX</text><text x="150" y="101" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Content experience</text></g><g><title>Evaluate the correspondence between expected and experienced content. The original items are needed to reproduce its measurement.</title><rect x="58" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="150" y="224" text-anchor="middle" font-size="12" fill="#666b66">CEX</text><text x="150" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Expectation</text><text x="150" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">alignment</text></g><g><title>Model the brand-related construct as a separate engagement antecedent. Its path is not an observed commercial uplift.</title><rect x="58" y="351" width="184" height="98" rx="12" fill="#eeece5"/><text x="150" y="374" text-anchor="middle" font-size="12" fill="#666b66">BE</text><text x="150" y="401" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Brand equity</text><text x="150" y="425" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">transfer</text></g><g><title>SEM examines the direct and mediated relationships. The reported 55% refers to explained variance, not a percentage increase in engagement.</title><rect x="398" y="201" width="184" height="98" rx="12" fill="#6a5879"/><text x="490" y="224" text-anchor="middle" font-size="12" fill="#ffffffcc">CE · mediator</text><text x="490" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Consumer engagement</text></g><g><title>The reported 70% refers to explained variance in the modeled construct. Survey retention measures do not establish logged repeat visits.</title><rect x="728" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="820" y="224" text-anchor="middle" font-size="12" fill="#666b66">CR · outcome</text><text x="820" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Customer retention</text></g></g><text x="35" y="622" font-size="15" fill="#666b66">Arrows show hypothesized structural relationships; cross-sectional SEM does not establish causal direction.</text><text x="35" y="651" font-size="13" fill="#666b66">SEM examines the direct and mediated relationships. The reported 55% refers to explained variance, not a percentage</text><text x="35" y="669" font-size="13" fill="#666b66">increase in engagement.</text></g></svg>