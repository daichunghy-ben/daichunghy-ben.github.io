<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Student diet quality · Knowledge and activity in the same model</title><desc id="desc">Reported study architecture. Regression separates adjusted associations from the descriptive knowledge scores. Arrows show model inputs and outcome; this cross-sectional model does not establish causation.</desc><rect width="1000" height="700" rx="18" fill="#faf9f6"/><g font-family="Calibri,Arial,sans-serif" fill="#24272c"><text x="35" y="41" font-size="15" fill="#6b7650">Reported study architecture</text><text x="35" y="82" font-size="29" font-weight="700">Knowledge and activity in the same model</text><g transform="translate(0 105)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#858981" stroke-width="1.5"/></marker></defs><path d="M 242 100 C 316.5 100, 316.5 250, 391 250" class="model-edge" data-from="knowledge" data-to="regression" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Nutrition knowledge → Multiple regression</title></path><path d="M 242 250 C 316.5 250, 316.5 250, 391 250" class="model-edge" data-from="activity" data-to="regression" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Physical activity → Multiple regression</title></path><path d="M 242 400 C 316.5 400, 316.5 250, 391 250" class="model-edge" data-from="controls" data-to="regression" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Age + sex → Multiple regression</title></path><path d="M 582 250 C 651.5 250, 651.5 250, 721 250" class="model-edge" data-from="regression" data-to="diet" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Multiple regression → Diet-quality score</title></path><g><title>The adapted 20-item CoNKS scale measures correct nutrition-knowledge responses. Its score enters the regression alongside activity and the demographic covariates.</title><rect x="58" y="51" width="184" height="98" rx="12" fill="#eeece5"/><text x="150" y="74" text-anchor="middle" font-size="12" fill="#666b66">CoNKS · 20 items</text><text x="150" y="101" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Nutrition knowledge</text></g><g><title>Activity is expressed in MET-minutes per week. Its adjusted association is evaluated alongside knowledge, age and sex.</title><rect x="58" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="150" y="224" text-anchor="middle" font-size="12" fill="#666b66">IPAQ-SF</text><text x="150" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Physical activity</text></g><g><title>The reported regression includes age and sex. Adjustment does not remove all possible confounding or establish time order.</title><rect x="58" y="351" width="184" height="98" rx="12" fill="#eeece5"/><text x="150" y="374" text-anchor="middle" font-size="12" fill="#666b66">Covariates</text><text x="150" y="401" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Age + sex</text></g><g><title>The reported model has R² = 0.538 in the student sample. This is explanatory fit in the supplied analysis, not a held-out prediction score.</title><rect x="398" y="201" width="184" height="98" rx="12" fill="#6b7650"/><text x="490" y="224" text-anchor="middle" font-size="12" fill="#ffffffcc">Association model</text><text x="490" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Multiple regression</text></g><g><title>Dietary responses provide the modeled outcome. Diversity, protective-food and food-to-limit scores remain distinct measures.</title><rect x="728" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="820" y="224" text-anchor="middle" font-size="12" fill="#666b66">DQQ outcome</text><text x="820" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Diet-quality score</text></g></g><text x="35" y="622" font-size="15" fill="#666b66">Arrows show model inputs and outcome; this cross-sectional model does not establish causation.</text><text x="35" y="651" font-size="13" fill="#666b66">The reported model has R² = 0.538 in the student sample. This is explanatory fit in the supplied analysis, not a</text><text x="35" y="669" font-size="13" fill="#666b66">held-out prediction score.</text></g></svg>