<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Arts workshop participation · Experience value, attitude and intention</title><desc id="desc">Reported study architecture. Measurement checks precede the reported PROCESS Model 4 mediation analysis. Arrows summarize the tested pathway; coefficients are not relabeled as standardized or causal.</desc><rect width="1000" height="700" rx="18" fill="#faf9f6"/><g font-family="Calibri,Arial,sans-serif" fill="#24272c"><text x="35" y="41" font-size="15" fill="#886952">Reported study architecture</text><text x="35" y="82" font-size="29" font-weight="700">Experience value, attitude and intention</text><g transform="translate(0 105)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#858981" stroke-width="1.5"/></marker></defs><path d="M 242 100 C 316.5 100, 316.5 250, 391 250" class="model-edge" data-from="learn" data-to="attitude" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Learning value → Workshop attitude</title></path><path d="M 242 250 C 316.5 250, 316.5 250, 391 250" class="model-edge" data-from="social" data-to="attitude" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Social value → Workshop attitude</title></path><path d="M 242 400 C 316.5 400, 316.5 250, 391 250" class="model-edge" data-from="hedonic" data-to="attitude" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Hedonic value → Workshop attitude</title></path><path d="M 582 250 C 651.5 250, 651.5 250, 721 250" class="model-edge" data-from="attitude" data-to="intention" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Workshop attitude → Participation intention</title></path><g><title>Evaluate the learning component of the workshop experience. The project reports a 0.35 learning-to-attitude path, without enough detail to label it standardized.</title><rect x="58" y="51" width="184" height="98" rx="12" fill="#eeece5"/><text x="150" y="74" text-anchor="middle" font-size="12" fill="#666b66">Experience dimension</text><text x="150" y="101" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Learning value</text></g><g><title>Represent the social component separately from learning and enjoyment. The experience dimensions connect with intention through the workshop-attitude pathway.</title><rect x="58" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="150" y="224" text-anchor="middle" font-size="12" fill="#666b66">Experience dimension</text><text x="150" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Social value</text></g><g><title>Represent enjoyment as a distinct experience dimension. The reported model connects this value with attitude toward the workshop.</title><rect x="58" y="351" width="184" height="98" rx="12" fill="#eeece5"/><text x="150" y="374" text-anchor="middle" font-size="12" fill="#666b66">Experience dimension</text><text x="150" y="401" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Hedonic value</text></g><g><title>PROCESS Model 4 examines an indirect pathway through attitude. The project reports an attitude-to-intention path of 0.59.</title><rect x="398" y="201" width="184" height="98" rx="12" fill="#886952"/><text x="490" y="224" text-anchor="middle" font-size="12" fill="#ffffffcc">Mediator</text><text x="490" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Workshop attitude</text></g><g><title>The source reports 216 valid responses in Melbourne. Intention is not an observed booking or repeat-attendance outcome.</title><rect x="728" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="820" y="224" text-anchor="middle" font-size="12" fill="#666b66">Outcome</text><text x="820" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Participation</text><text x="820" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">intention</text></g></g><text x="35" y="622" font-size="15" fill="#666b66">Arrows summarize the tested pathway; coefficients are not relabeled as standardized or causal.</text><text x="35" y="651" font-size="13" fill="#666b66">PROCESS Model 4 examines an indirect pathway through attitude. The project reports an attitude-to-intention path of</text><text x="35" y="669" font-size="13" fill="#666b66">0.59.</text></g></svg>