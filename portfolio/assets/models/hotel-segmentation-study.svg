<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Hotel customer segmentation · From review text to guest segments</title><desc id="desc">Reported study architecture. Language analysis builds the features; clustering tests how reviews group together. Arrows show the analysis sequence, not causal effects.</desc><rect width="1000" height="700" rx="18" fill="#faf9f6"/><g font-family="Calibri,Arial,sans-serif" fill="#24272c"><text x="35" y="41" font-size="15" fill="#315f70">Reported study architecture</text><text x="35" y="82" font-size="29" font-weight="700">From review text to guest segments</text><g transform="translate(0 105)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#858981" stroke-width="1.5"/></marker></defs><path d="M 212 250 C 241.5 250, 241.5 250, 271 250" class="model-edge" data-from="reviews" data-to="absa" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Review text → Aspect sentiment</title></path><path d="M 462 250 C 496.5 250, 496.5 140, 531 140" class="model-edge" data-from="absa" data-to="kmeans" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Aspect sentiment → K-means</title></path><path d="M 462 250 C 496.5 250, 496.5 360, 531 360" class="model-edge" data-from="absa" data-to="gmm" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Aspect sentiment → Gaussian mixture</title></path><path d="M 722 140 C 751.5 140, 751.5 250, 781 250" class="model-edge" data-from="kmeans" data-to="segments" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>K-means → Guest profiles</title></path><path d="M 722 360 C 751.5 360, 751.5 250, 781 250" class="model-edge" data-from="gmm" data-to="segments" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Gaussian mixture → Guest profiles</title></path><g><title>74,896 reviews across 458 Da Nang hotels. The unit represented in the segmentation is a review, not a verified unique guest.</title><rect x="28" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="120" y="224" text-anchor="middle" font-size="12" fill="#666b66">Data</text><text x="120" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Review text</text></g><g><title>Map sentences to hotel attributes and score sentiment at that level. Project materials report 148,846 aspect–sentence pairs; they do not identify a specific ABSA checkpoint.</title><rect x="278" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="370" y="224" text-anchor="middle" font-size="12" fill="#666b66">Language analysis</text><text x="370" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Aspect sentiment</text></g><g><title>Group reviews by similarity in attribute-level features. Ten reported groups form the displayed segmentation; the portfolio does not contain the full selection diagnostics.</title><rect x="538" y="91" width="184" height="98" rx="12" fill="#315f70"/><text x="630" y="114" text-anchor="middle" font-size="12" fill="#ffffffcc">Primary model</text><text x="630" y="141" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">K-means</text></g><g><title>Check the segmentation with a probabilistic alternative. Agreement scores and covariance settings are not supplied, so this is a reported robustness step rather than a reproduced test.</title><rect x="538" y="311" width="184" height="98" rx="12" fill="#eeece5"/><text x="630" y="334" text-anchor="middle" font-size="12" fill="#666b66">Robustness model</text><text x="630" y="361" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Gaussian mixture</text></g><g><title>Compare what each group emphasizes, then name the profiles. The labels summarize priorities visible in the review features.</title><rect x="788" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="880" y="224" text-anchor="middle" font-size="12" fill="#666b66">Interpretation</text><text x="880" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Guest profiles</text></g></g><text x="35" y="622" font-size="15" fill="#666b66">Arrows show the analysis sequence, not causal effects.</text><text x="35" y="651" font-size="13" fill="#666b66">Group reviews by similarity in attribute-level features. Ten reported groups form the displayed segmentation; the</text><text x="35" y="669" font-size="13" fill="#666b66">portfolio does not contain the full selection diagnostics.</text></g></svg>