<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Virtual influencers and purchase intention · Test disclosure alongside persuasion</title><desc id="desc">Proposed extension · not performed. Extend the experiment to the decision a brand actually faces: how clearly to identify a virtual creator. Proposed workflow. No new data or model results are claimed.</desc><rect width="1000" height="700" rx="18" fill="#faf9f6"/><g font-family="Calibri,Arial,sans-serif" fill="#24272c"><text x="35" y="41" font-size="15" fill="#795e76">Proposed extension · not performed</text><text x="35" y="82" font-size="29" font-weight="700">Test disclosure alongside persuasion</text><g transform="translate(0 105)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#858981" stroke-width="1.5"/></marker></defs><path d="M 242 250 C 311.5 250, 311.5 125, 381 125" class="model-edge" data-from="disclose" data-to="mechanism" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Disclosure × message → Trust + recognition: Hypothesis</title></path><path d="M 572 125 C 636.5 125, 636.5 250, 701 250" class="model-edge" data-from="mechanism" data-to="behavior" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Trust + recognition → Click or product choice: Hypothesis</title></path><path d="M 242 250 C 471.5 250, 471.5 250, 701 250" class="model-edge" data-from="disclose" data-to="behavior" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Disclosure × message → Click or product choice: Primary contrast</title></path><path d="M 480 341 C 480 295.5, 471.5 295.5, 471.5 250" class="model-edge is-moderation" data-from="moderator" data-to="behavior" data-ref-from="disclose" data-ref-to="behavior" fill="none" stroke="#b8b9b2" stroke-width="1.7" stroke-dasharray="7 6" marker-end="url(#arrow)"><title>Human preference → Click or product choice: Interaction</title></path><g><title>Randomize disclosure clarity and message quality with matched creative assets. Pretest comprehension and keep the product, creator exposure and layout comparable.</title><rect x="58" y="201" width="184" height="98" rx="12" fill="#795e76"/><text x="150" y="224" text-anchor="middle" font-size="12" fill="#ffffffcc">New experiment</text><text x="150" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Disclosure ×</text><text x="150" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">message</text></g><g><title>Measure recognition of the virtual creator and trust after exposure. Mediation remains conditional on temporal ordering and identification assumptions.</title><rect x="388" y="76" width="184" height="98" rx="12" fill="#eeece5"/><text x="480" y="99" text-anchor="middle" font-size="12" fill="#666b66">Measured mechanism</text><text x="480" y="126" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Trust + recognition</text></g><g><title>Record a prespecified voluntary click or incentive-compatible choice. Report intention as a separate secondary outcome.</title><rect x="708" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="800" y="224" text-anchor="middle" font-size="12" fill="#666b66">Behavioral outcome</text><text x="800" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Click or product</text><text x="800" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">choice</text></g><g><title>Retain the measured moderator, define interaction tests before collection and avoid splitting a continuous score just to obtain a stronger result.</title><rect x="388" y="341" width="184" height="98" rx="12" fill="#eeece5"/><text x="480" y="364" text-anchor="middle" font-size="12" fill="#666b66">Measured variation</text><text x="480" y="391" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Human preference</text></g></g><text x="35" y="622" font-size="15" fill="#666b66">Proposed workflow. No new data or model results are claimed.</text><text x="35" y="651" font-size="13" fill="#666b66">Randomize disclosure clarity and message quality with matched creative assets. Pretest comprehension and keep the</text><text x="35" y="669" font-size="13" fill="#666b66">product, creator exposure and layout comparable.</text></g></svg>