<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Hotel service priorities · Semantic mapping meets asymmetric effects</title><desc id="desc">Reported study architecture. The language model identifies attributes; PRCA distinguishes reward from penalty. Arrows show the analysis sequence, not causal effects.</desc><rect width="1000" height="700" rx="18" fill="#faf9f6"/><g font-family="Calibri,Arial,sans-serif" fill="#24272c"><text x="35" y="41" font-size="15" fill="#6d7560">Reported study architecture</text><text x="35" y="82" font-size="29" font-weight="700">Semantic mapping meets asymmetric effects</text><g transform="translate(0 105)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#858981" stroke-width="1.5"/></marker></defs><path d="M 212 250 C 241.5 250, 241.5 250, 271 250" class="model-edge" data-from="reviews" data-to="sbert" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Hotel reviews → Sentence-BERT</title></path><path d="M 462 250 C 496.5 250, 496.5 125, 531 125" class="model-edge" data-from="sbert" data-to="negative" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Sentence-BERT → Negative sentiment</title></path><path d="M 462 250 C 496.5 250, 496.5 375, 531 375" class="model-edge" data-from="sbert" data-to="positive" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Sentence-BERT → Positive sentiment</title></path><path d="M 722 125 C 751.5 125, 751.5 250, 781 250" class="model-edge" data-from="negative" data-to="prca" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Negative sentiment → PRCA + Kano</title></path><path d="M 722 375 C 751.5 375, 751.5 250, 781 250" class="model-edge" data-from="positive" data-to="prca" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Positive sentiment → PRCA + Kano</title></path><g><title>Project materials report 97,014 reviews from approximately 1,000 properties. Retain the review score as a separate outcome.</title><rect x="28" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="120" y="224" text-anchor="middle" font-size="12" fill="#666b66">Text + ratings</text><text x="120" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Hotel reviews</text></g><g><title>Use sentence embeddings to map review text to eight service attributes. Embedding similarity is a mapping signal; it is not the review rating itself.</title><rect x="278" y="201" width="184" height="98" rx="12" fill="#6d7560"/><text x="370" y="224" text-anchor="middle" font-size="12" fill="#ffffffcc">Attribute mapping</text><text x="370" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Sentence-BERT</text></g><g><title>Construct the negative attribute indicators used in the regression. A penalty coefficient describes a score association when the negative indicator is present.</title><rect x="538" y="76" width="184" height="98" rx="12" fill="#eeece5"/><text x="630" y="99" text-anchor="middle" font-size="12" fill="#666b66">Penalty input</text><text x="630" y="126" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Negative sentiment</text></g><g><title>Construct positive attribute indicators separately. Reward and penalty need not be equal in size or opposite in sign.</title><rect x="538" y="326" width="184" height="98" rx="12" fill="#eeece5"/><text x="630" y="349" text-anchor="middle" font-size="12" fill="#666b66">Reward input</text><text x="630" y="376" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Positive sentiment</text></g><g><title>Compare OLS coefficients with HC1 robust standard errors, then classify service attributes. The reported R² = 0.220 describes fit to the supplied sample.</title><rect x="788" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="880" y="224" text-anchor="middle" font-size="12" fill="#666b66">OLS · HC1 errors</text><text x="880" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">PRCA + Kano</text></g></g><text x="35" y="622" font-size="15" fill="#666b66">Arrows show the analysis sequence, not causal effects.</text><text x="35" y="651" font-size="13" fill="#666b66">Use sentence embeddings to map review text to eight service attributes. Embedding similarity is a mapping signal; it is</text><text x="35" y="669" font-size="13" fill="#666b66">not the review rating itself.</text></g></svg>