<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Student diet quality · Can prediction identify a useful intervention?</title><desc id="desc">Proposed extension · not performed. Build a small, auditable prediction benchmark before testing nutrition support. Proposed workflow. No new data or model results are claimed.</desc><rect width="1000" height="700" rx="18" fill="#faf9f6"/><g font-family="Calibri,Arial,sans-serif" fill="#24272c"><text x="35" y="41" font-size="15" fill="#6b7650">Proposed extension · not performed</text><text x="35" y="82" font-size="29" font-weight="700">Can prediction identify a useful intervention?</text><g transform="translate(0 105)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#858981" stroke-width="1.5"/></marker></defs><path d="M 212 250 C 246.5 250, 246.5 250, 281 250" class="model-edge" data-from="followup" data-to="models" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Repeated diet measures → Regression + trees</title></path><path d="M 472 250 C 506.5 250, 506.5 250, 541 250" class="model-edge" data-from="models" data-to="validate" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Regression + trees → Nested validation</title></path><path d="M 732 250 C 756.5 250, 756.5 250, 781 250" class="model-edge" data-from="validate" data-to="trial" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Nested validation → Nutrition-support trial</title></path><g><title>Collect repeated dietary responses with prespecified recall windows. Record the timing of knowledge, activity and outcome measures.</title><rect x="28" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="120" y="224" text-anchor="middle" font-size="12" fill="#666b66">New data</text><text x="120" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Repeated diet</text><text x="120" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">measures</text></g><g><title>Compare regularized regression with a constrained tree ensemble. Model complexity should follow available independent participants and outcome reliability.</title><rect x="288" y="201" width="184" height="98" rx="12" fill="#6b7650"/><text x="380" y="224" text-anchor="middle" font-size="12" fill="#ffffffcc">Candidate models</text><text x="380" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Regression + trees</text></g><g><title>Keep each participant within one fold and reserve future measurements. Report error, calibration and subgroup performance; do not use test data to tune the model.</title><rect x="548" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="640" y="224" text-anchor="middle" font-size="12" fill="#666b66">Prediction check</text><text x="640" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Nested validation</text></g><g><title>Use the benchmark to define a support strategy, then test that strategy separately. Random assignment is needed to estimate its effect on the prespecified diet outcome.</title><rect x="788" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="880" y="224" text-anchor="middle" font-size="12" fill="#666b66">Causal question</text><text x="880" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Nutrition-support</text><text x="880" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">trial</text></g></g><text x="35" y="622" font-size="15" fill="#666b66">Proposed workflow. No new data or model results are claimed.</text><text x="35" y="651" font-size="13" fill="#666b66">Compare regularized regression with a constrained tree ensemble. Model complexity should follow available independent</text><text x="35" y="669" font-size="13" fill="#666b66">participants and outcome reliability.</text></g></svg>