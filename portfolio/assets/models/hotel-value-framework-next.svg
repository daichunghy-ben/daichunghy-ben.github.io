<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Hotel customer value · Turn the value framework into measurable constructs</title><desc id="desc">Proposed extension · not performed. Use qualitative work to define the dimensions before estimating a structural model. Proposed workflow. No new data or model results are claimed.</desc><rect width="1000" height="700" rx="18" fill="#faf9f6"/><g font-family="Calibri,Arial,sans-serif" fill="#24272c"><text x="35" y="41" font-size="15" fill="#957044">Proposed extension · not performed</text><text x="35" y="82" font-size="29" font-weight="700">Turn the value framework into measurable constructs</text><g transform="translate(0 105)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#858981" stroke-width="1.5"/></marker></defs><path d="M 212 250 C 246.5 250, 246.5 250, 281 250" class="model-edge" data-from="interview" data-to="instrument" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Guest interviews → Items + pilot</title></path><path d="M 472 250 C 506.5 250, 506.5 250, 541 250" class="model-edge" data-from="instrument" data-to="cfa" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Items + pilot → CFA + invariance</title></path><path d="M 732 250 C 756.5 250, 756.5 250, 781 250" class="model-edge" data-from="cfa" data-to="outcome" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>CFA + invariance → Value → stay outcome</title></path><g><title>Ask guests what comfort, care and local experience mean in actual stays. Purposefully sample contrasting profiles; retain a transparent coding record.</title><rect x="28" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="120" y="224" text-anchor="middle" font-size="12" fill="#666b66">Construct definition</text><text x="120" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Guest interviews</text></g><g><title>Write candidate items from the definitions and existing scales. Check content coverage, translation and comprehension before statistical screening.</title><rect x="288" y="201" width="184" height="98" rx="12" fill="#957044"/><text x="380" y="224" text-anchor="middle" font-size="12" fill="#ffffffcc">Measurement</text><text x="380" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Items + pilot</text></g><g><title>Collect an independent survey to test measurement structure and comparability. EFA may precede CFA if the dimensions remain uncertain.</title><rect x="548" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="640" y="224" text-anchor="middle" font-size="12" fill="#666b66">Candidate validation</text><text x="640" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">CFA + invariance</text></g><g><title>Test whether the measured dimensions relate to satisfaction or return intention. Observed repeat stays would require permissioned longitudinal records.</title><rect x="788" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="880" y="224" text-anchor="middle" font-size="12" fill="#666b66">Proposed relationship</text><text x="880" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Value → stay</text><text x="880" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">outcome</text></g></g><text x="35" y="622" font-size="15" fill="#666b66">Proposed workflow. No new data or model results are claimed.</text><text x="35" y="651" font-size="13" fill="#666b66">Write candidate items from the definitions and existing scales. Check content coverage, translation and comprehension</text><text x="35" y="669" font-size="13" fill="#666b66">before statistical screening.</text></g></svg>