<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Arts workshop participation · Test an experience change against actual booking</title><desc id="desc">Proposed extension · not performed. Move from a mediation model to a small, measurable service experiment. Proposed workflow. No new data or model results are claimed.</desc><rect width="1000" height="700" rx="18" fill="#faf9f6"/><g font-family="Calibri,Arial,sans-serif" fill="#24272c"><text x="35" y="41" font-size="15" fill="#886952">Proposed extension · not performed</text><text x="35" y="82" font-size="29" font-weight="700">Test an experience change against actual booking</text><g transform="translate(0 105)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#858981" stroke-width="1.5"/></marker></defs><path d="M 212 250 C 246.5 250, 246.5 250, 281 250" class="model-edge" data-from="change" data-to="assign" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Guided-learning format → Workshop assignment</title></path><path d="M 472 250 C 506.5 250, 506.5 250, 541 250" class="model-edge" data-from="assign" data-to="outcome" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Workshop assignment → Booking + experience</title></path><path d="M 732 250 C 756.5 250, 756.5 250, 781 250" class="model-edge" data-from="outcome" data-to="evaluate" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Booking + experience → Primary contrast</title></path><g><title>Define one teachable change, such as structured beginner guidance. Match the comparison workshop on duration, price and basic materials.</title><rect x="28" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="120" y="224" text-anchor="middle" font-size="12" fill="#666b66">New intervention</text><text x="120" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Guided-learning</text><text x="120" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">format</text></g><g><title>Randomize a feasible unit such as a session. Record who receives the format and avoid mixing conditions within a shared session.</title><rect x="288" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="380" y="224" text-anchor="middle" font-size="12" fill="#666b66">Experiment design</text><text x="380" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Workshop assignment</text></g><g><title>Measure learning experience and attitude separately from bookings or repeat attendance. Set a consistent follow-up window.</title><rect x="548" y="201" width="184" height="98" rx="12" fill="#886952"/><text x="640" y="224" text-anchor="middle" font-size="12" fill="#ffffffcc">Observed and measured</text><text x="640" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Booking +</text><text x="640" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">experience</text></g><g><title>Estimate the randomized contrast on the prespecified booking outcome. Examine mediation secondarily with explicit assumptions and session-level dependence.</title><rect x="788" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="880" y="224" text-anchor="middle" font-size="12" fill="#666b66">Decision</text><text x="880" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Primary contrast</text></g></g><text x="35" y="622" font-size="15" fill="#666b66">Proposed workflow. No new data or model results are claimed.</text><text x="35" y="651" font-size="13" fill="#666b66">Measure learning experience and attitude separately from bookings or repeat attendance. Set a consistent follow-up</text><text x="35" y="669" font-size="13" fill="#666b66">window.</text></g></svg>