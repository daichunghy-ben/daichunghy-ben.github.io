<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Virtual influencers and purchase intention · Message, appeal and purchase intention</title><desc id="desc">Reported study architecture. The 2 × 2 experiment separates manipulated cues from the measured moderator. Solid arrows show cue–outcome relationships; dashed arrows point to the relationships moderated by speciesism.</desc><rect width="1000" height="700" rx="18" fill="#faf9f6"/><g font-family="Calibri,Arial,sans-serif" fill="#24272c"><text x="35" y="41" font-size="15" fill="#795e76">Reported study architecture</text><text x="35" y="82" font-size="29" font-weight="700">Message, appeal and purchase intention</text><g transform="translate(0 105)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#858981" stroke-width="1.5"/></marker></defs><path d="M 242 125 C 471.5 125, 471.5 250, 701 250" class="model-edge" data-from="argument" data-to="response" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Argument quality → Purchase intention: Cue contrast</title></path><path d="M 242 375 C 471.5 375, 471.5 250, 701 250" class="model-edge" data-from="appeal" data-to="response" fill="none" stroke="#b8b9b2" stroke-width="1.7" marker-end="url(#arrow)"><title>Peripheral appeal → Purchase intention: Cue contrast</title></path><path d="M 480 124 C 480 155.75, 471.5 155.75, 471.5 187.5" class="model-edge is-moderation" data-from="species" data-to="response" data-ref-from="argument" data-ref-to="response" fill="none" stroke="#b8b9b2" stroke-width="1.7" stroke-dasharray="7 6" marker-end="url(#arrow)"><title>Speciesism → Purchase intention: Moderation</title></path><path d="M 480 124 C 480 218.25, 471.5 218.25, 471.5 312.5" class="model-edge is-moderation" data-from="species" data-to="response" data-ref-from="appeal" data-ref-to="response" fill="none" stroke="#b8b9b2" stroke-width="1.7" stroke-dasharray="7 6" marker-end="url(#arrow)"><title>Speciesism → Purchase intention: Moderation</title></path><g><title>High and low argument quality define one experimental factor. The supplied stimulus set supports this contrast; no additional conditions are introduced.</title><rect x="58" y="76" width="184" height="98" rx="12" fill="#eeece5"/><text x="150" y="99" text-anchor="middle" font-size="12" fill="#666b66">Central-route cue</text><text x="150" y="126" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Argument quality</text></g><g><title>Appeal is the second experimental factor. The framework includes social attractiveness, physical attractiveness and attitude similarity.</title><rect x="58" y="326" width="184" height="98" rx="12" fill="#eeece5"/><text x="150" y="349" text-anchor="middle" font-size="12" fill="#666b66">Peripheral-route cue</text><text x="150" y="376" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Peripheral appeal</text></g><g><title>Compare intention across the four stimulus conditions. The outcome is a stated response, not an observed transaction.</title><rect x="708" y="201" width="184" height="98" rx="12" fill="#eeece5"/><text x="800" y="224" text-anchor="middle" font-size="12" fill="#666b66">Measured outcome</text><text x="800" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#24272c">Purchase intention</text></g><g><title>Examine whether the response to virtual endorsers differs with stronger human preference. Speciesism is measured rather than randomized.</title><rect x="388" y="26" width="184" height="98" rx="12" fill="#795e76"/><text x="480" y="49" text-anchor="middle" font-size="12" fill="#ffffffcc">Measured moderator</text><text x="480" y="76" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Speciesism</text></g></g><text x="35" y="622" font-size="15" fill="#666b66">Solid arrows show cue–outcome relationships; dashed arrows point to the relationships moderated by speciesism.</text><text x="35" y="651" font-size="13" fill="#666b66">Examine whether the response to virtual endorsers differs with stronger human preference. Speciesism is measured rather</text><text x="35" y="669" font-size="13" fill="#666b66">than randomized.</text></g></svg>